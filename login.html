<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - منصتك التعليمية</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <div class="arabic-background">

        <div class="arabic-symbol symbol-1">ع</div>
        <div class="arabic-symbol symbol-2">ض</div>
        <div class="arabic-symbol symbol-3">ق</div>
        <div class="arabic-symbol symbol-4">م</div>

        <div class="book">
            <div class="book-page"></div>
            <div class="book-page"></div>
        </div>

        <div class="pen"></div>

        <div class="floating-letter letter-1">أ</div>
        <div class="floating-letter letter-2">ب</div>
        <div class="floating-letter letter-3">ل</div>
        <div class="floating-letter letter-4">ي</div>

    </div>


    <div class="dark-overlay"></div>



    <main class="login-container">

        <div class="login-box">


            <div class="login-header">

                <div class="logo-circle" id="logoCircle">

                    <img src="1.jpeg" alt="شعار المنصة">

                </div>

                <h1>تسجيل الدخول</h1>

                <p>أهلاً بك في منصتك التعليمية</p>

            </div>



            <form id="loginForm">


                <div class="input-box">

                    <span class="input-icon">📧</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        required
                    >

                </div>



                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="كلمة السر"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <div id="errorBox" class="error-box"></div>



                <button type="submit" class="login-button">

                    دخول إلى المنصة

                    <span>←</span>

                </button>


            </form>



            <div class="login-footer">

                <p>

                    ليس لديك حساب؟

                    <a href="signup.html" class="signup-link">
                        أنشئ حساب جديد
                    </a>

                </p>

            </div>


        </div>

    </main>



    <div class="logo-popup" id="logoPopup">

        <span class="close-logo" id="closeLogo">&times;</span>

        <img src="1.jpeg" alt="شعار المنصة">

    </div>



    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>

</html>
