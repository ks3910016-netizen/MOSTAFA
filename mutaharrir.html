<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المتحرر - الثانوية العامة</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="home-page">


    <!-- الهيدر -->

    <header class="home-header">

        <div class="social-wrapper" id="socialWrapper">

            <a href="#" class="social-item social-whatsapp" title="واتساب">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a href="#" class="social-item social-facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#" class="social-item social-youtube" title="يوتيوب">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <a href="#" class="social-item social-telegram" title="تليجرام">
                <i class="fa-brands fa-telegram"></i>
            </a>

            <a href="#" class="social-item social-email" title="إيميل">
                <i class="fa-solid fa-envelope"></i>
            </a>

            <a href="#" class="social-item social-phone" title="تليفون">
                <i class="fa-solid fa-phone"></i>
            </a>

            <button class="social-toggle" id="socialToggle" type="button">
                <i class="fa-solid fa-share-nodes"></i>
            </button>

        </div>



        <div class="platform-title">

            <h1>المتحرر</h1>
            <p>تدريبات المتحرر</p>

        </div>



        <button class="profile-icon" id="logoutBtn" title="تسجيل الخروج">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>

    </header>



    <!-- المحتوى -->

    <main class="home-content">


        <a href="high-school.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
            رجوع إلى المواد
        </a>



        <section class="welcome-section">

            <h2>
                <span id="welcomeText">أهلاً يا</span>
                <span id="homeUsername">طالب</span>
                👋
            </h2>

            <p>هذا القسم سوف يتوفر قريبًا</p>

            <div class="progress-line"></div>

        </section>



        <section class="quote-card">

            <div class="quote-text">

                <h3>المتحرر</h3>
                <p>تدريبات المتحرر</p>
                <small>- منصة الثانوية العامة -</small>

            </div>

            <div class="quote-icon">

                <i class="fa-solid fa-file-lines"></i>

            </div>

        </section>



        <section class="platform-sections">

            <h2>دروس المتحرر</h2>


            <div class="lessons-list">


                <!-- 1 -->
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">1</div>

                    <div class="lesson-info">
                        <span>الدرس الأول</span>
                        <h3>قريبًا</h3>
                    </div>

                    <button class="lesson-button-inline" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">
                        <i class="fa-solid fa-clock"></i>
                        <span>قريبًا</span>
                    </button>

                </div>



                <!-- 2 -->
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">2</div>

                    <div class="lesson-info">
                        <span>الدرس الثاني</span>
                        <h3>قريبًا</h3>
                    </div>

                    <button class="lesson-button-inline" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">
                        <i class="fa-solid fa-clock"></i>
                        <span>قريبًا</span>
                    </button>

                </div>



                <!-- 3 -->
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">3</div>

                    <div class="lesson-info">
                        <span>الدرس الثالث</span>
                        <h3>قريبًا</h3>
                    </div>

                    <button class="lesson-button-inline" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">
                        <i class="fa-solid fa-clock"></i>
                        <span>قريبًا</span>
                    </button>

                </div>



                <!-- 4 -->
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">4</div>

                    <div class="lesson-info">
                        <span>الدرس الرابع</span>
                        <h3>قريبًا</h3>
                    </div>

                    <button class="lesson-button-inline" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">
                        <i class="fa-solid fa-clock"></i>
                        <span>قريبًا</span>
                    </button>

                </div>



                <!-- 5 -->
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">5</div>

                    <div class="lesson-info">
                        <span>الدرس الخامس</span>
                        <h3>قريبًا</h3>
                    </div>

                    <button class="lesson-button-inline" type="button" disabled style="opacity: 0.5; cursor: not-allowed;">
                        <i class="fa-solid fa-clock"></i>
                        <span>قريبًا</span>
                    </button>

                </div>


            </div>

        </section>


    </main>



    <nav class="bottom-navigation">

        <a href="#" class="nav-item">
            <i class="fa-regular fa-user"></i>
            <span>حسابي</span>
        </a>

        <a href="high-school.html" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>

        <a href="#" class="nav-item">
            <i class="fa-solid fa-book-open"></i>
            <span>الكورسات</span>
        </a>

    </nav>



    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>

</html>
